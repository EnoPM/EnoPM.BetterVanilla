name: Create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        default: 'v1.3.12'
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run create-release script
        working-directory: release-files
        run: cmd /c .\create-release.bat $env:RELEASE_VERSION

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $expectedZip = "release-files/output/BetterVanilla.$env:RELEASE_VERSION.zip"
          $expectedPlugin = "release-files/output/BetterVanilla.dll"
          $expectedInstaller = "release-files/output/BetterVanillaInstaller.exe"
          if (-not (Test-Path -LiteralPath $expectedZip)) { throw "Missing release archive: $expectedZip" }
          if (-not (Test-Path -LiteralPath $expectedPlugin)) { throw "Missing plugin: $expectedPlugin" }
          if (-not (Test-Path -LiteralPath $expectedInstaller)) { throw "Missing installer: $expectedInstaller" }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release-files/output/
          if-no-files-found: error

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: BetterVanilla ${{ env.RELEASE_VERSION }}
          body: Release of BetterVanilla ${{ env.RELEASE_VERSION }}
          files: release-artifacts/**
